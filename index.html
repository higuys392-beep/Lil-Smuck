<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Launcher</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #1e1e1e; color: white; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #007acc; color: white; }
  </style>
</head>
<body>
  <button onclick="launchApp()">Open App</button>

  <script>
    function launchApp() {
      // Replace with your target URL
      window.open('https://cdn.jsdelivr.net/gh/breezeontop/svg@latest/index.svg', 'WebAppWindow', 'width=1200,height=800,resizable=yes,scrollbars=yes,status=no,location=no');
    }
    // Automatically attempts to open on file load
    window.onload = launchApp;
  </script>
</body>
</html>
